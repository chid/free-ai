<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
  <title id="t">Awesome Free AI</title>
  <desc id="d">A dated, audited directory of free AI tools, APIs and platforms.</desc>
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="80%">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#0b0d13" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" x2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1280" height="320" fill="#0b0d13"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="640" y="150" font-size="84" font-weight="800" fill="url(#title)">Awesome Free AI</text>
    <text x="640" y="200" font-size="26" fill="#94a3b8">Free tiers, local runners and paid plans — dated, tracked, audited.</text>
  </g>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#f1f5f9" text-anchor="middle">
    <rect x="320" y="238" width="170" height="38" rx="19" fill="#151824" stroke="#10b981" stroke-opacity="0.5"/>
    <text x="405" y="263">Free &amp; free-tier</text>
    <rect x="510" y="238" width="130" height="38" rx="19" fill="#151824" stroke="#a78bfa" stroke-opacity="0.5"/>
    <text x="575" y="263">Local LLMs</text>
    <rect x="660" y="238" width="150" height="38" rx="19" fill="#151824" stroke="#f59e0b" stroke-opacity="0.5"/>
    <text x="735" y="263">Paid &amp; quotas</text>
    <rect x="830" y="238" width="130" height="38" rx="19" fill="#151824" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="895" y="263">Model timeline</text>
  </g>
</svg>
